name: distributed-wagering

x-app-environment: &app-environment
  DATABASE_URL: postgresql://wagering_app:wagering_app@postgres:5432/wagering
  MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wagering
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  WAGER_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
  EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wagering-events.fifo
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  ministack:
    image: ministackorg/ministack@sha256:2669fc88f0669624a58af35ee1a4c8f4e2eb5db29dac0988dddd43ce447e701f
    ports:
      - "4566:4566"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: dependencies
    command: ["bun", "run", "src/infrastructure/database/migrate.ts", "up"]
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    deploy:
      replicas: 3
    environment:
      <<: *app-environment
      APP_ROLES: api,consumer,outbox,scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_healthy

  otel-lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.11.10
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"

  k6:
    profiles: ["load"]
    image: grafana/k6:1.3.0
    volumes:
      - ./test/load:/scripts:ro
      - ./load-results:/results
    environment:
      BASE_URL: http://app:3000
